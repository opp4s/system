server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — força re-resolução a cada 10s
    # Necessário para evitar cache de IP após rebuild do zavy-api
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Regex capture: strip /api/ prefix e encaminha para zavy-api
    # /api/api/v1/... → http://zavy-api:3000/api/v1/...
    location ~ ^/api/(.*)$ {
        set $api_upstream http://zavy-api:3000;
        proxy_pass $api_upstream/$1$is_args$args;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
