# Nginx — api.zavycrm.com
# Proxy para zavy-api (porta 3100)
# SSL via Let's Encrypt (Certbot) ou Cloudflare Origin Certificate

server {
    server_name api.zavycrm.com;

    # Certbot HTTP-01 challenge — deve ser servido como arquivo estático
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        allow all;
    }

    # Proxy para Rails API
    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering off;
    }

    # Health check sem log
    location = /up {
        proxy_pass http://127.0.0.1:3100/up;
        proxy_set_header Host $host;
        access_log off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.zavycrm.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.zavycrm.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.zavycrm.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.zavycrm.com;
    return 404; # managed by Certbot


}