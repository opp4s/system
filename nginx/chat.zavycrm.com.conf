# Nginx — chat.zavycrm.com
# Proxy para Chatwoot (porta 3101)
# SSL gerenciado pelo Certbot (Let's Encrypt)
#
# Instalação:
#   sudo cp nginx/chat.zavycrm.com.conf /etc/nginx/sites-available/chat.zavycrm.com
#   sudo ln -s /etc/nginx/sites-available/chat.zavycrm.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d chat.zavycrm.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name chat.zavycrm.com;

    location / {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # WebSocket para ActionCable / cable do Chatwoot
    location /cable {
        proxy_pass         http://127.0.0.1:3101/cable;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
